<div class="hero bg-base-200 min-h-screen">
    @if (!registerMode()) {
    <div class="hero-content text-center">
        <div class="flex flex-col items-center">
            <span class="text-9xl leading-none select-none">🎾</span>
            <h1 class="text-5xl font-bold">{{ 'home.title' | translate}}</h1>
            <p class="py-6">{{'home.come' | translate}}</p>
            <div class="flex items-center gap-3">
                @if(!accountService.currentUser()){
                    <button (click)="showRegister(true)" class="btn btn-primary btn-lg">{{'home.register' | translate}}</button>
                }
                <button class="btn-info btn-lg">{{"home.more" | translate}}</button>
            </div>
        </div>
    </div>
    }
    @else { <!-- se registerMode è true mostra il componente di registrazione -->
        <div class="w-full flex text-2xl text-center justify-center">
            <app-register class="w-full"
            (cancelRegister)="showRegister($event)"  
            ></app-register> 
            <!--- $event riceve gli eventi in uscita dal nostro componente register 
            qui in pratica eseguo cancelRegister e dico che se viene spinto su cancel-> emit false 
            e quindi torna indietro altrimenti se rimane true mostra il componente di registrazione -->
        </div>
    }

</div>


<!-- [membersFromHome]="membersFromApp" from parents to child in app-register component-->
 <!-- (cancelRegister)="showRegister($event)" from child to parent in app-register component -->
