@if(member(); as member){
<div routerLink="/members/{{member.id}}" 
    class="card cursor-pointer transition-all duration-300 ease-in-out 
    transform hover:-translate-y-2 relative">
    <img 
        src="{{member?.imageUrl || '/user.png' }}" 
        alt="{{member.displayName}} image" 
        class="roundend-lg">

    @if (isOnline()) {
        <span class="status status-success status-xl absolute top-3 left-3"></span>
    }
        <button (click)="toggleLike($event)"
        class="absolute top-1 right-1 z-40 btn btn-ghost btn-circle">
            <svg xmlns="http://www.w3.org/2000/svg"
            [attr.fill]="hasLiked() ? 'gold' : 'none' " 
            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
            </svg>
        </button>
    <div class="card-actions z-40 
    absolute bottom-0 w-full px-3 py-1 rounded-b-lg
    bg-linear-to-t from-black via-black/75 to-black/0">
        <div class="flex flex-col text-white w-full">
            <span class="font-semibold">{{member.displayName}}, {{member.dateOfBirth | age}}</span>
            <div class="flex items-center justify-between">
                <span class="text-sm">{{member.city}}</span>
                <span class="badge badge-sm badge-success text-white">🎾 Player</span>
            </div>
        </div>
    </div>
</div>
}
